overwrite: true
schema: ../contract/aimp.schema
documents: null
generates:
  src/__generated__/types.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      contextType: ../context#Context
      mappers:
        User: ../models/User#UserModel
        Subaccount: ../models/Subaccount#SubaccountModel
        AuthRequest: ../models/AuthRequest#AuthRequestModel
        Topic: ../models/Topic#TopicModel
        Message: ../models/Message#MessageModel
  ./src/__generated__/graphql.schema.json:
    plugins:
      - json
