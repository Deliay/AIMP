overwrite: true
schema:
  - '../contract/*.graphql'
generates:
  src/__generated__/types.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      contextType: ../auth/context#Context
      mappers:
        User: ../models/User#IUser
        AgentBot: ../models/AgentBot#IAgentBot
        AuthRequest: ../models/AuthRequest#IAuthRequest
        Topic: ../models/Topic#ITopic
  ./src/__generated__/graphql.schema.json:
    plugins:
      - introspection
