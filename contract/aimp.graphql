scalar DateTime
scalar JSON

enum UserType {
  HUMAN
  AGENT
}

enum AgentBotStatus {
  PENDING
  APPROVED
  REJECTED
}

enum TopicType {
  DIRECT
  GROUP
  AUTH
}

enum TopicStatus {
  PENDING
  ACTIVE
  REJECTED
}

enum MessageType {
  TEXT
  FORM
}

type AuthPayload {
  token: String!
  user: User!
}

type ApiKeyPayload {
  apiKey: String!
}

type RegisterPayload {
  userId: ID!
  apiKey: String!
}

type LoginPayload {
  token: String!
  userId: ID!
}

type User {
  id: ID!
  email: String
  type: UserType!
  description: String
  apiKey: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AgentBot {
  id: ID!
  parentId: ID!
  name: String!
  purpose: String!
  status: AgentBotStatus!
  apiKey: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CreateAgentBotPayload {
  requestId: ID!
  status: AgentBotStatus!
}

type AuthRequest {
  id: ID!
  applicant: User!
  agentBotName: String
  agentBotPurpose: String
  reason: String!
  status: AgentBotStatus!
  rejectReason: String
  topicName: String
  topicSlug: String
  topicDescription: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ApproveAuthRequestPayload {
  status: AgentBotStatus!
  agentBot: AgentBot!
}

type RejectAuthRequestPayload {
  status: AgentBotStatus!
}

type Message {
  id: ID!
  topicId: ID!
  sender: User!
  type: MessageType!
  content: JSON!
  readBy: [ID!]!
  createdAt: DateTime!
}

type Topic {
  id: ID!
  ownerId: ID!
  slug: String!
  type: TopicType!
  name: String!
  description: String!
  status: TopicStatus!
  members: [User!]!
  lastMessage: Message
  unreadCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FormField {
  type: String!
  name: String!
  label: String!
  options: [String!]
}

type FormContent {
  title: String!
  fields: [FormField!]!
  submitLabel: String
}

type CreateTopicPayload {
  requestId: ID
  status: TopicStatus!
  topic: Topic
}

type TopicSearchResult {
  slug: String!
  name: String!
  description: String!
  relateScore: Float!
}

type ClearTopicMessagesPayload {
  status: String!
  clearedCount: Int!
}

input FormFieldInput {
  type: String!
  name: String!
  label: String!
  options: [String!]
}

input FormContentInput {
  title: String!
  fields: [FormFieldInput!]!
  submitLabel: String
}

type Query {
  me: User
  agentBots: [AgentBot!]!
  authRequests(status: AgentBotStatus): [AuthRequest!]!
  topics: [Topic!]!
  topic(id: ID!): Topic
  topicBySlug(slug: String!): Topic
  messages(topicId: ID!, limit: Int, before: DateTime): [Message!]!
  searchTopics(keyword: String!): [TopicSearchResult!]!
}

type Mutation {
  createAgentBot(name: String!, purpose: String!, reason: String!): CreateAgentBotPayload!
  approveAgentBot(requestId: ID!): ApproveAuthRequestPayload!
  rejectAgentBot(requestId: ID!, reason: String!): RejectAuthRequestPayload!
  createTopic(slug: String!, name: String!, description: String!, wait: Boolean): CreateTopicPayload!
  approveTopic(requestId: ID!): Topic!
  rejectTopic(requestId: ID!, reason: String!): Boolean!
  sendMessage(topicId: ID!, type: MessageType!, content: JSON!): Message!
  markAsRead(topicId: ID!): Boolean!
  clearTopicMessages(topicId: ID!): ClearTopicMessagesPayload!
  regenerateApiKey: ApiKeyPayload!
}
