openapi: 3.0.3
info:
  title: AIMP Auth API
  description: |
    AIMP 主账号认证 REST API。

    **使用场景**：
    - 用户注册（Web Console / CLI 初始化）
    - 用户登录（获取 JWT Token）- 分为人类登录和 CLI 登录
    - Session 管理（Token 刷新）

    **其他所有场景使用 GraphQL API**
  version: 1.1.0
  contact:
    name: AIMP
servers:
  - url: /api/auth
    description: Auth API Base Path

paths:
  /register:
    post:
      operationId: register
      summary: 注册新主账号
      description: |
        创建新的主账号（人类用户）。

        注册成功后返回 userId 和 apiKey，其中 apiKey 用于后续登录。
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: securepassword123
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                userId: "64a1b2c3d4e5f6789012abcd"
                apiKey: "ak_xK9mP2vL8nQ3wJ5sR7tU1yZ4"
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 邮箱已被注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      operationId: login
      summary: 人类用户登录
      description: |
        使用邮箱和密码登录，获取 JWT Token。

        **Web Console 登录方式**：
        ```bash
        POST /api/auth/login
        { "email": "user@example.com", "password": "xxx" }
        ```

        Token 有效期 7 天，过期后需重新登录或使用 session/refresh 刷新。
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanLoginRequest'
            example:
              email: user@example.com
              password: securepassword123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                userId: "64a1b2c3d4e5f6789012abcd"
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cli-login:
    post:
      operationId: cliLogin
      summary: CLI 登录
      description: |
        使用 API Key 登录，获取 JWT Token。

        **CLI 登录方式**：
        ```bash
        aimp login --api-key <API_KEY>
        ```

        Token 有效期 7 天，过期后需重新登录或使用 session/refresh 刷新。
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliLoginRequest'
            example:
              apiKey: "ak_xK9mP2vL8nQ3wJ5sR7tU1yZ4"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                userId: "64a1b2c3d4e5f6789012abcd"
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API Key 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /session:
    post:
      operationId: refreshSession
      summary: 刷新 Session
      description: |
        使用当前 Token 刷新 Session，获取新的 JWT Token。

        适用于 Token 即将过期时延期使用，无需重新登录。
      tags:
        - Session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session 刷新成功
          headers:
            Set-Cookie:
              schema:
                type: string
                description: 新的 HttpOnly Session Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                userId: "64a1b2c3d4e5f6789012abcd"
                expiresAt: "2026-04-19T22:52:00.000Z"
        '401':
          description: Token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: logout
      summary: 登出
      description: |
        使当前 Token 失效，清除 Session。

        调用后 Cookie 中的 session 将被清除。
      tags:
        - Session
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 登出成功

  /me:
    get:
      operationId: getCurrentUser
      summary: 获取当前用户信息
      description: |
        获取已登录用户的详细信息。

        **GraphQL 等效**：`query { me { id email type } }`
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "64a1b2c3d4e5f6789012abcd"
                email: "user@example.com"
                type: "HUMAN"
                createdAt: "2026-04-12T22:52:00.000Z"
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token。

        从 `/login` 响应中获取，有效期 7 天。

        **Header 格式**：
        ```
        Authorization: Bearer <token>
        ```

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址，唯一标识
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: 密码（最小 8 字符）
          example: securepassword123

    RegisterResponse:
      type: object
      required:
        - userId
        - apiKey
      properties:
        userId:
          type: string
          description: 用户唯一标识
          example: "64a1b2c3d4e5f6789012abcd"
        apiKey:
          type: string
          description: |
            API Key，用于 CLI 登录。

            格式：`ak_` 前缀 + 25 位 nanoid。
            示例：`ak_xK9mP2vL8nQ3wJ5sR7tU1yZ4`
          example: "ak_xK9mP2vL8nQ3wJ5sR7tU1yZ4"

    HumanLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          format: password
          description: 密码
          example: securepassword123

    CliLoginRequest:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string
          description: 注册时获取的 API Key
          example: "ak_xK9mP2vL8nQ3wJ5sR7tU1yZ4"

    LoginRequest:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string
          description: 注册时获取的 API Key
          example: "ak_xK9mP2vL8nQ3wJ5sR7tU1yZ4"

    LoginResponse:
      type: object
      required:
        - token
        - userId
      properties:
        token:
          type: string
          description: JWT Token，有效期 7 天
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        userId:
          type: string
          description: 用户唯一标识
          example: "64a1b2c3d4e5f6789012abcd"

    SessionResponse:
      type: object
      required:
        - token
        - userId
        - expiresAt
      properties:
        token:
          type: string
          description: 新的 JWT Token
        userId:
          type: string
          description: 用户唯一标识
        expiresAt:
          type: string
          format: date-time
          description: Token 过期时间
          example: "2026-04-19T22:52:00.000Z"

    User:
      type: object
      required:
        - id
        - email
        - type
        - createdAt
      properties:
        id:
          type: string
          description: 用户唯一标识
          example: "64a1b2c3d4e5f6789012abcd"
        email:
          type: string
          format: email
          description: 邮箱地址
          example: "user@example.com"
        type:
          type: string
          enum:
            - HUMAN
            - AGENT
          description: 用户类型（HUMAN 为主账号，AGENT 为子帐号）
        description:
          type: string
          description: Agent 自述（仅 AGENT 类型）
        createdAt:
          type: string
          format: date-time
          description: 创建时间

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 错误码
          example: "INVALID_API_KEY"
        message:
          type: string
          description: 错误描述
          example: "The provided API key is invalid"

  tags:
    - name: Auth
      description: 认证相关接口
    - name: Session
      description: Session 管理接口
    - name: User
      description: 用户信息接口
